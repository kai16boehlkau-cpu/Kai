<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Einstellungen – CALORIE TRACKER</title>
  <link rel="icon" type="image/png" href="static/logo.png">
  <link rel="stylesheet" href="static/style.css">
  <script>
    // Ohne festgelegtes Tagesziel gibt es nur die Startseite.
    if (localStorage.getItem("kzt_goal_set") !== "true") {
      window.location.replace("index.html");
    }
  </script>
</head>
<body>

  <div id="splash">
    <img class="splash-logo" id="splash-logo" src="static/logo.png" alt="">
    <div class="splash-name">CALORIE <span>TRACKER</span></div>
  </div>

  <div id="toast-area" aria-live="polite"></div>

  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark">
          <img src="static/logo.png" alt="Logo des Calorie Trackers">
        </span>
        <span class="brand-name">CALORIE <span>TRACKER</span></span>
      </a>

      <nav class="main-nav" aria-label="Hauptnavigation">
        <a href="index.html">Dashboard</a>
        <a href="kalender.html">Kalender</a>
        <a href="einstellungen.html" class="active">Einstellungen</a>
        <a href="datenbank.html">Datenbank</a>
      </nav>

      <button type="button" class="nav-toggle" id="nav-toggle"
              aria-label="Menü öffnen" aria-expanded="false">☰</button>
    </div>
  </header>

  <main class="container">

    <section class="card fade-in" id="ziel-aendern">
      <div class="card-head">
        <div>
          <h2>Tagesziel</h2>
        </div>
      </div>

      <form class="start-form" id="settings-form">
        <div class="form-field">
          <label for="settings_goal">Kalorien pro Tag (800 – 6000)</label>
          <input type="number" id="settings_goal" min="800" max="6000" step="1" value="2000" required>
        </div>

        <button type="submit" class="btn">Tagesziel speichern</button>
      </form>
    </section>

  </main>

  <script src="static/app.js"></script>
</body>
</html>
