{% extends "base.html" %}

{% block title %}<title>Einstellungen – CALORIE TRACKER</title>{% endblock %}

{% block content %}

    <!-- ======================================================
         EINSTELLUNGEN: nur das Kalorienziel aendern
         ====================================================== -->
    <section class="card fade-in" id="ziel-aendern">
      <div class="card-head">
        <div>
          <h2>Tagesziel</h2>
        </div>
      </div>

      <form method="POST" action="/update_goal" class="start-form">
        <input type="hidden" name="from" value="settings">
        <input type="hidden" name="date" value="{{ selected_date }}">

        <div class="form-field">
          <label for="settings_goal">Kalorien pro Tag (800 – 6000)</label>
          <input type="number" id="settings_goal" name="daily_goal"
                 min="800" max="6000" step="1" value="{{ daily_goal }}" required>
        </div>

        <button type="submit" class="btn">Tagesziel speichern</button>
      </form>
    </section>

{% endblock %}
