{% extends "base.html" %}

{% block title %}<title>Einstellungen – CALORIE TRACKER</title>{% endblock %}

{% block content %}

    <!-- ======================================================
         EINSTELLUNGEN: nur das Kalorienziel ändern
         ====================================================== -->
    <section class="hero" id="einstellungen">
      <div class="hero-text">
        <span class="kicker">Einstellungen</span>
        <h2>⚙️ Tagesziel ändern</h2>
        <p class="hero-sub">Hier stellst du dein persönliches Kalorienziel pro Tag ein.</p>
      </div>
    </section>

    <section class="card fade-in" id="ziel-aendern">
      <div class="goal-readonly">
        <strong>{{ daily_goal }}</strong>
        <span>aktuell gespeichert (kcal pro Tag)</span>
      </div>

      <form method="POST" action="/update_goal" class="start-form">
        <input type="hidden" name="from" value="settings">
        <input type="hidden" name="date" value="{{ selected_date }}">

        <div class="form-field">
          <label for="settings_goal">Tagesziel in kcal (800 – 6000)</label>
          <input type="number" id="settings_goal" name="daily_goal"
                 min="800" max="6000" step="1" value="{{ daily_goal }}" required>
        </div>

        <button type="submit" class="btn">Tagesziel speichern</button>
      </form>
    </section>

{% endblock %}
